codecov:
  require_ci_to_pass: true
  # Two jobs upload a report for a commit: the unit job's `unit.out` and the
  # e2e job's `e2e_coverage.out` (both gated to ubuntu-latest, so the macOS
  # half of each matrix uploads nothing). Without this, codecov posts its
  # verdict on whichever arrives first and never re-evaluates: on #558 the
  # e2e reports landed 28s before the unit one and `codecov/patch` reported
  # "0.00% of diff hit" for a diff that unit tests covered completely, since
  # e2e exercises the built binary and reaches neither `internal/blob` nor
  # `pkg/crypto`. Keep in step with the number of `codecov/codecov-action`
  # steps in `.github/workflows/ci.yml`.
  notify:
    after_n_builds: 2

comment:
  after_n_builds: 2

# Test-support code. These packages exist to be consumed by *other* packages'
# tests, so Go's per-package coverage cannot attribute their execution and
# reports them as 0% however heavily they are used.
ignore:
  - "pkg/store/storetest/**"
  # The external-module fixture (RFC 0022). It is a separate Go module built by
  # a test to prove the public contracts are implementable from outside; it is
  # never linked into this module, so it has no coverage to report.
  - "internal/apicheck/testdata/**"

coverage:
  status:
    project:
      default:
        target: 60%
        threshold: 2%
    patch:
      default:
        target: auto
        threshold: 2%
