name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
      - run: go test -race -shuffle=on -count=1 ./...

  # The test job above runs on Linux only, so unlike in ci.yml both runners
  # here are verifying build paths nothing else has compiled.
  platform:
    name: Platform build paths
    needs: test
    uses: ./.github/workflows/wc-platform-tests.yml
    with:
      runners: '["macos-latest", "windows-latest"]'

  release:
    name: Release
    needs:
      - test
      - platform
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/cloudstic_*
            dist/checksums.txt
  winget:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Cloudstic.CLI
          installers-regex: '_windows_(amd64|arm64)\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
